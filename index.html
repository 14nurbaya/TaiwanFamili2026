<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taiwan Family Trip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app, 5 bottom tabs, one column up to 720px.
   Colour: cool paper ground, deep teal ink; Kaohsiung amber, Taipei blue, travel violet. */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --ink:#15302E; --muted:#58706D; --line:#D6E2DF;
  --accent:#0E7C7B; --accent-ink:#FFFFFF;
  --khh:#9A5B00; --khh-bg:#FBEBD2; --tpe:#245A9E; --tpe-bg:#DCE8F8; --trv:#5B3FA3; --trv-bg:#E8E0F6;
  --good:#2E7D4F; --good-bg:#DDF0E4; --warn:#8A5200; --warn-bg:#FFEBC2; --bad:#B3261E; --bad-bg:#FBDDD9;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1B1A; --surface:#162624; --ink:#E4EFED; --muted:#93AAA6; --line:#2A403D;
  --accent:#4FC1BE; --accent-ink:#06211F;
  --khh:#F0B35B; --khh-bg:#3A2A10; --tpe:#8DB4F0; --tpe-bg:#162A47; --trv:#B9A2F0; --trv-bg:#2A2047;
  --good:#6FCB93; --good-bg:#12301F; --warn:#F2C262; --warn-bg:#3A2D0B; --bad:#F2928B; --bad-bg:#3E1714; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:28px;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
header.top{display:flex;flex-direction:column;gap:6px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live i{background:var(--good)}
.sync.off i{background:var(--bad)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
/* countdown */
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font-family:var(--display);font-size:56px;line-height:1;font-weight:700;color:var(--accent)}
.route{display:flex;height:34px;border-radius:9px;overflow:hidden;font-size:12px;font-weight:600}
.route div{display:flex;align-items:center;justify-content:center;padding:0 6px;white-space:nowrap;overflow:hidden}
.route .khh{flex:3;background:var(--khh-bg);color:var(--khh)}
.route .trv{flex:2;background:var(--trv-bg);color:var(--trv)}
.route .tpe{flex:4;background:var(--tpe-bg);color:var(--tpe)}
.route .fly{flex:1.4;background:var(--good-bg);color:var(--good)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.khh{background:var(--khh-bg);color:var(--khh)}
.chip.tpe{background:var(--tpe-bg);color:var(--tpe)}
.chip.trv,.chip.fly{background:var(--trv-bg);color:var(--trv)}
/* buttons and fields */
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.tiny{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
/* day cards */
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.daycard header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.part{display:grid;grid-template-columns:84px 1fr;gap:8px;font-size:14px}
.part b{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.dayhead{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.dayhead .d{font-family:var(--display);font-weight:700;font-size:22px;min-width:44px;text-align:center;line-height:1}
.dayhead .d small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.dayhead .t{flex:1;min-width:0}
.dayhead .t b{display:block}
.dayhead .t span{font-size:13px;color:var(--muted)}
.kh{border-left:5px solid var(--khh)} .tp{border-left:5px solid var(--tpe)} .tv{border-left:5px solid var(--trv)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .w{font-size:11px;font-weight:700;text-align:center;color:var(--muted);text-transform:uppercase;padding:2px 0}
.cal button{aspect-ratio:1/1.1;border:1px solid transparent;background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;min-width:0}
.cal button b{font-family:var(--display);font-size:16px}
.cal button small{font-size:9px;font-weight:700;letter-spacing:.04em}
.cal .out{opacity:.35;background:transparent;cursor:default}
.cal .khh{background:var(--khh-bg);color:var(--khh)} .cal .tpe{background:var(--tpe-bg);color:var(--tpe)} .cal .trv{background:var(--trv-bg);color:var(--trv)}
.cal .today{border-color:var(--ink)}
.cal .sel{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:8px;flex-wrap:wrap}
/* todo */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .tick{background:none;border:0;padding:0;cursor:pointer;flex:none;line-height:0;margin-top:1px}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item.done .tx{color:var(--muted);text-decoration:line-through}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-bottom:0}
.opt{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.opt .v{font-weight:700}
.opt .v.yes{color:var(--good)} .opt .v.no{color:var(--bad)}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:720px;margin:0 auto;display:flex}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:10px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:9;max-width:90%}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .3s}}
@media (max-width:420px){.part{grid-template-columns:1fr;gap:0}.count b{font-size:48px}}
</style>
</head>

const API_OK=/^https:\/\/script\.google\.com\//.test(API_URL);
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null};
let pass=LS("tt_pass")||"",myName=LS("tt_name")||"";
const joined=()=>API_OK&&!!pass&&!!myName;

async function api(body){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({pass:pass},body))});
  const j=await r.json();
  if(!j||!j.ok){const e=new Error((j&&j.error)||"error");e.code=(j&&j.error)||"error";throw e}
  return j;
}
function makeDb(){
  const listeners={};let seq=0,inflight=0,last=null;
  return{
    collection:c=>({onSnapshot:cb=>{listeners[c]=cb}}),
    doc:path=>({set:data=>{
      const p=path.split("/");seq++;inflight++;
      return api({action:"set",coll:p[0],id:p[1],data:data,by:myName}).finally(()=>{inflight--;seq++})
    }}),
    async poll(){
      if(inflight)return;
      const s=seq,j=await api({action:"all"});
      if(s!==seq||inflight)return;
      const txt=JSON.stringify(j.data||{});
      if(txt===last){onSame();return}
      last=txt;
      for(const c in listeners){
        const m=(j.data||{})[c]||{};
        listeners[c]({docs:Object.keys(m).map(id=>({id:id,data:()=>m[id]}))});
      }
    }
  };
}

function save(coll,id,data){
  S[coll][id]=data;scheduleRender();

async function resolveNames(){

}

function costs(){
  const c=cfg(),total=c.elderly+c.adults+c.teens+c.kids+c.toddlers,vans=Math.max(1,Math.ceil(total/c.perVan));
  const vrows=VANS.map(v=>({d:addDays(START,v[0]),p:v[1],ty:v[2],rate:v[2]==="Full day"?c.fullDay:c.transfer,cost:vans*(v[2]==="Full day"?c.fullDay:c.transfer)}));

  const tour=Math.max(0,+c.tour||0);

  return{c,total,vans,vrows,van,hsr,tour,tot,sgd:tot/c.fx,pp:tot/c.fx/total,full};

      const its=DURING.filter(x=>x.day===o),dn=its.filter(x=>S.during[x.id]&&S.during[x.id].done).length;
      h+=`<div class="card" style="gap:4px"><div class="spread"><b>${fmt(addDays(START,o),{weekday:"short",day:"numeric",month:"short"})} · ${esc(DY(o).h)}</b><span class="small muted num">${dn}/${its.length}</span></div>`;
      h+=its.map(x=>{const r=S.during[x.id],dn2=!!(r&&r.done);return `<div class="item${dn2?" done":""}"><button class="tick" data-a="dtick" data-id="${x.id}" aria-label="${esc(x.t)}: ${dn2?"done":"not done"}"${dis()}>${tickSvg(dn2?"Done":"")}</button><div class="body"><span class="tx">${esc(x.t)}</span><div class="meta"><span>${x.w}</span>${dn2&&who(r)?`<span>by ${who(r)}</span>`:""}</div></div></div>`}).join("")+"</div>";
    }
    h+="</section>";
  }
  return h;
}
function vRides(){
  const c=costs(),k=c.c;
  const num=(id,l,v,step)=>`<label class="f">${l}<input type="number" inputmode="decimal" id="cfg-${id}" data-cfg="${id}" value="${v}" min="0" step="${step||1}"${dis()}></label>`;
  let h=`<section class="section"><div><div class="eyebrow">For ${c.total} people</div><h2>Rental and transport</h2></div>
   <div class="opt"><span class="v yes">Booked as one tour</span><b>Paid tour, 16–18 Dec</b><span class="small">Kaohsiung to Alishan, Taichung, then Taipei in a single booking. Ask about the vehicle size for 14, halal meals, prayer breaks, pickup at Howard Plaza, drop-off at Boutech, and whether the two hotel nights are included. Type the quote under Estimate settings so the total is right.</span></div>
   <div class="opt"><span class="v yes">Recommended</span><b>Two chartered 9-seater vans with a driver</b><span class="small">Use for 19 Dec (Palace Museum and Shilin), 20 Dec (Yehliu and Keelung) and the airport transfers. In Kaohsiung, Cijin, the mosque and Suzuka work by MRT, ferry or taxi, and Pokémon Center and Taipei 101 are an easy MRT ride. Each van carries about 7 people and about 6 large bags. Estimate: NT$${money(c.van)} (about S$${money(c.van/k.fx)}).</span></div>
   <div class="opt"><span class="v yes">Recommended</span><b>HSR on 13 Dec</b><span class="small">Taoyuan to Zuoying at 10:34. Reserve all 14 seats together. Under 6 free without a seat, 6–11 half price. Estimate: NT$${money(c.hsr)}. Check the exact Taoyuan–Zuoying fare when you book; the default fare here is a rough figure.</span></div>
   <div class="opt"><span class="v no">Not recommended</span><b>Self-drive rental</b><span class="small">Needs a Singapore licence plus an International Driving Permit from an official issuer. Taiwan drives on the right, with left-hand-drive cars. About NT$3,000 per day per car, and 14 people need 3 cars. Parking is hard and it is stressful with 8 children.</span></div>
   <div class="opt"><b>Taxis and ride-hailing</b><span class="small">Fine for short hops. 3 taxis per trip, hard to keep the group together, expensive for day trips.</span></div></section>`;
  h+=`<section class="card"><h2>Estimate settings</h2><p class="small muted">Edit any number. Everyone sees the same figures.</p><div class="grid2">
   ${num("tour","Paid tour, whole group (NT$)",k.tour,500)}${num("elderly","Elderly",k.elderly)}${num("adults","Adults",k.adults)}${num("teens","Teens 12–16",k.teens)}${num("kids","Children 6–11",k.kids)}${num("toddlers","Under 6",k.toddlers)}
   ${num("perVan","Passengers per van",k.perVan)}${num("fullDay","Full-day van (NT$)",k.fullDay,100)}${num("transfer","Transfer per van (NT$)",k.transfer,100)}${num("fx","NT$ per S$1",k.fx,.1)}${num("hsrFare","HSR adult fare (NT$)",k.hsrFare,10)}</div>
   <p class="small muted">Children's age split, the transfer price and the exchange rate are assumptions. Get real quotes before booking.</p></section>`;
  h+=`<section class="card"><h2>Van plan (${c.vans} vans)</h2><div class="tbl"><table><thead><tr><th>Date</th><th>Purpose</th><th>Type</th><th class="r">NT$</th></tr></thead><tbody>
   ${c.vrows.map(r=>`<tr><td>${fmt(r.d,{day:"numeric",month:"short"})}</td><td>${esc(r.p)}</td><td>${r.ty}</td><td class="r">${money(r.cost)}</td></tr>`).join("")}
   <tr class="total"><td colspan="3">Vans total</td><td class="r">${money(c.van)}</td></tr></tbody></table></div></section>`;
  h+=`<section class="card"><h2>Budget summary</h2><div class="tbl"><table><tbody>
   <tr><td>Vans</td><td class="r">NT$${money(c.van)}</td></tr><tr><td>HSR (13 Dec)</td><td class="r">NT$${money(c.hsr)}</td></tr><tr><td>Paid tour (16–18 Dec)</td><td class="r">${c.tour?"NT$"+money(c.tour):"not entered"}</td></tr>
   <tr class="total"><td>Total</td><td class="r">NT$${money(c.tot)}</td></tr><tr><td>Total in Singapore dollars</td><td class="r">S$${money(c.sgd)}</td></tr><tr><td>Per person</td><td class="r">S$${money(c.pp)}</td></tr></tbody></table></div></section>`;
  h+=`<section class="card"><h2>Booking tips</h2><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
   <li>Two vans carry about 12 large bags. On arrival and departure days, plan 1 bag per person or add a third vehicle for luggage.</li>
   <li>Ask for child seats for the 2-year-old: about NT$200 per day each, maximum 2 per van.</li>
   <li>Ask each company about driver language, hours included, overtime rate (about NT$500–900 per hour), and any driver accommodation fee on days finishing after 19:00.</li>
   <li>Get 2–3 quotes (Klook, KKday, local charter companies) and update the numbers above.</li></ul></section>`;
  h+=`<section class="section small muted"><b>Sources (checked 31 Oct 2026; verify before booking)</b>
   <a href="https://www.northwest.com.tw/travel/index_en.php?travel=885" rel="noopener">Van charter rates</a>
   <a href="https://www.kkday.com/en/product/268651" rel="noopener">Child seat and overtime terms</a>
   <a href="https://www.tripool.app/en/articles/Chauffeured-Car-Price-List-en" rel="noopener">9-seater capacity and luggage</a>
   <a href="https://www.goodcars.tw/en/blog/article/general/singaporean-taiwan-car-rental-guide" rel="noopener">Singapore licence and IDP</a>
   <a href="https://www.expatfocus.com/taiwan/guide/taiwan-car-rental" rel="noopener">Car rental requirements</a></section>`;
  return h;
}
function vGate(){
  if(!API_OK)return `<section class="card"><h2>Almost ready</h2><p>This page is not connected to your Google Sheet yet. Open <b>index.html</b> in a text editor, find the line <b>const API_URL=</b> and paste your Web app address between the quotes. The address starts with <b>https://script.google.com/macros/s/</b>. Then upload the file again.</p></section>`;
  return `<section class="card"><h2>Join the family plan</h2><p class="small muted">Enter your name, so the family can see who ticked what, and the family passcode. They are saved on this phone only.</p>
   <label class="f">Your name<input type="text" id="j-name" maxlength="40" autocomplete="given-name" value="${esc(myName)}"></label>
   <label class="f">Family passcode<input type="password" id="j-pass" autocomplete="off"></label>
   <button class="btn" data-a="join">Join</button></section>`;
}

const VIEWS={home:vHome,calendar:vCalendar,schedule:vSchedule,todo:vTodo,rides:vRides};
function render(){
  const v=(location.hash||"#home").slice(1);
  view=VIEWS[v]?v:"home";
  const ok=joined();
  document.getElementById("nav").hidden=!ok;
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.v===view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const sy=!ok?"":sync==="live"?'<span class="sync live"><i></i>Shared and up to date</span>':sync==="off"?'<span class="sync off"><i></i>Not reachable</span>':'<span class="sync"><i></i>Connecting…</span>';
  let top=`<header class="top"><div class="eyebrow">13–22 Dec 2026 · Kaohsiung, Alishan, Taichung, Taipei</div><h1>Taiwan Family Trip</h1><div class="row">${sy}${ok?`<span class="small muted">${esc(myName)}</span><button class="btn ghost tiny" data-a="signout">Sign out</button>`:""}</div></header>`;
  if(ok&&sync==="off")top+='<div class="banner">The shared sheet is not reachable, so changes may not be saved or shown to others. Check your connection; the page keeps trying.</div>';
  app.innerHTML=top+(ok?VIEWS[view]():vGate());
}
window.addEventListener("hashchange",()=>{window.scrollTo(0,0);render()});

/* ---------- events ---------- */
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i;
  if(a==="join"){doJoin();return}
  if(a==="signout"){signOut();return}
  if(a==="hprev"){homeDay=Math.max(0,homeDay-1);render()}
  else if(a==="hnext"){homeDay=Math.min(10,homeDay+1);render()}
  else if(a==="pick"){selDay=i;render()}
  else if(a==="editday"&&canWrite){editing=i;open.add(i);render()}
  else if(a==="canceledit"){editing=null;render()}
  else if(a==="saveday"&&canWrite){const o={};FIELDS.forEach(f=>{const el=document.getElementById("ed-"+f);o[f]=((el&&el.value)||"").trim().slice(0,600)});if(!o.h){toast("Add a title for the day.");return}o.by=uid||null;save("plan","d"+i,o);editing=null;render();toast("Day saved for everyone.")}
  else if(a==="resetday"&&canWrite){save("plan","d"+i,{});editing=null;render();toast("Day set back to the original plan.")}
  else if(a==="newidea"&&canWrite){const el=document.getElementById("idea-n"),n=((el&&el.value)||"").trim().slice(0,160);if(!n){toast("Type a place first.");return}const id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);ideaDraft="";save("ideas",id,{n:n,t:"",by:uid||null})}
  else if(a==="ideagone"&&canWrite){const x=allIdeas().find(z=>z.id===b.dataset.id);if(x)save("ideas",x.id,{gone:true,n:x.n,t:x.t||"",by:uid||null})}
  else if(a==="idea2day"&&canWrite){
    const x=allIdeas().find(z=>z.id===b.dataset.id);if(!x)return;
    const pk=pick[x.id]||{day:0,part:"a"},j=pk.day,cur=DY(j),f=pk.part;
    const o=Object.assign({},(S.plan||{})["d"+j]||{});
    o[f]=((cur[f]||"")+(cur[f]?" ":"")+"Also: "+x.n+".").slice(0,600);o.by=uid||null;
    save("plan","d"+j,o);save("ideas",x.id,{gone:true,n:x.n,t:x.t||"",by:uid||null});
    toast("Added to "+fmt(addDays(START,j),{day:"numeric",month:"short"})+". Use Edit this day to adjust it.");
  }
  else if(a==="openday"){open.add(i);location.hash="#schedule";setTimeout(()=>{const el=document.querySelector('[data-a="toggle"][data-i="'+i+'"]');if(el)el.scrollIntoView({block:"start"})},60)}
  else if(a==="toggle"){open.has(i)?open.delete(i):open.add(i);render()}
  else if(a==="tmode"){tMode=b.dataset.m;render()}
  else if(a==="pfilter"){pFilter=b.dataset.f;render()}
  else if(a==="cycle"&&canWrite){const t=TASKS.find(x=>x.id===b.dataset.id),s=PSTAT[(PSTAT.indexOf(pstatus(t))+1)%3];save("pretrip",t.id,{status:s,by:uid||null})}
  else if(a==="dtick"&&canWrite){const id=b.dataset.id,r=S.during[id];save("during",id,{done:!(r&&r.done),by:uid||null})}
});
app.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.bk){const m=Object.assign({},S.bookings.main||{});m[el.dataset.bk]=el.value.trim();save("bookings","main",m)}
  else if(el.dataset.cfg){const v=parseFloat(el.value);if(isFinite(v)&&v>=0){const m=Object.assign({},S.settings.main||{});m[el.dataset.cfg]=v;save("settings","main",m)}}
  else if(el.dataset.pick){const id=el.dataset.pick,pk=Object.assign({day:0,part:"a"},pick[id]||{});if(el.dataset.pf==="day")pk.day=+el.value;else pk.part=el.value;pick[id]=pk}
  else if(el.dataset.day!=null){const k="d"+el.dataset.day,r=Object.assign({},S.days[k]||{});r[el.dataset.f]=el.value;r.by=uid||null;save("days",k,r)}
});
app.addEventListener("input",e=>{if(e.target&&e.target.id==="idea-n")ideaDraft=e.target.value});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="j-pass")doJoin()});
boot();
})();
</script>
